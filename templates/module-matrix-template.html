<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Module Matrix</title>
<style>
  :root {
    --bg: #f6f8fb;
    --surface: #ffffff;
    --border: #dde4ee;
    --text: #1f2937;
    --text-dim: #6b7280;
    --accent: #2563eb;
    --accent-soft: #dbeafe;
    --dep-line: #b45309;
    --dep-soft: #fef3c7;
    --dependent-line: #047857;
    --dependent-soft: #d1fae5;
    --planned-line: #7c3aed;
    --planned-soft: #ede9fe;
    --status-implemented: #047857;
    --status-specced: #2563eb;
    --status-planned: #b45309;
    --status-proposed: #6b7280;
    --radius: 10px;
    --shadow: 0 1px 3px rgba(16, 24, 40, .08), 0 1px 2px rgba(16, 24, 40, .06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
    padding: 32px 40px 64px;
  }
  header { margin-bottom: 8px; }
  h1 { font-size: 22px; font-weight: 650; }
  .meta { color: var(--text-dim); font-size: 12px; margin-bottom: 20px; }
  .legend {
    display: flex; gap: 16px; flex-wrap: wrap;
    font-size: 12px; color: var(--text-dim); margin-bottom: 28px;
  }
  .legend span::before {
    content: ""; display: inline-block; width: 10px; height: 10px;
    border-radius: 50%; margin-right: 6px; vertical-align: baseline;
  }
  .legend .st-implemented::before { background: var(--status-implemented); }
  .legend .st-specced::before     { background: var(--status-specced); }
  .legend .st-planned::before     { background: var(--status-planned); }
  .legend .st-proposed::before    { background: var(--status-proposed); }
  .legend .hint { margin-left: auto; }

  .layer { display: flex; gap: 20px; margin-bottom: 26px; align-items: flex-start; }
  .layer-label {
    flex: 0 0 130px; position: sticky; top: 16px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow);
  }
  .layer-label .n { font-size: 17px; font-weight: 700; color: var(--accent); }
  .layer-label .d { font-size: 11px; color: var(--text-dim); }
  .layer-modules { display: flex; flex-wrap: wrap; gap: 12px; flex: 1; }

  .module {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 12px 14px; min-width: 210px; max-width: 280px;
    cursor: default; transition: border-color .12s, background .12s;
  }
  .module .id { font-weight: 650; font-size: 13.5px; }
  .module .ns { font-size: 11px; color: var(--text-dim); font-family: Consolas, monospace; word-break: break-all; }
  .module .deps { margin-top: 8px; font-size: 11px; color: var(--text-dim); }
  .module .deps b { color: var(--text); font-weight: 600; }
  .module .deps.planned-deps { color: var(--planned-line); }
  .module .deps.planned-deps b { color: var(--planned-line); }
  .module .links { margin-top: 6px; font-size: 11px; }
  .module .links a { color: var(--accent); text-decoration: none; margin-right: 10px; }
  .module .links a:hover { text-decoration: underline; }
  .badge {
    float: right; font-size: 10px; font-weight: 600; letter-spacing: .3px;
    padding: 2px 8px; border-radius: 999px; color: #fff; text-transform: uppercase;
  }
  .badge.implemented { background: var(--status-implemented); }
  .badge.specced     { background: var(--status-specced); }
  .badge.planned     { background: var(--status-planned); }
  .badge.proposed    { background: var(--status-proposed); }

  .module.hl-self      { border-color: var(--accent); background: var(--accent-soft); }
  .module.hl-dep       { border-color: var(--dep-line); background: var(--dep-soft); }
  .module.hl-dependent { border-color: var(--dependent-line); background: var(--dependent-soft); }
  .module.hl-planned   { border-color: var(--planned-line); border-style: dashed; background: var(--planned-soft); }
  .module.dim { opacity: .38; }

  .error { color: #b91c1c; background: #fee2e2; border: 1px solid #fecaca;
           border-radius: var(--radius); padding: 14px 16px; }
</style>
</head>
<body>
<header>
  <h1 id="title">Module Matrix</h1>
  <div class="meta" id="meta"></div>
  <div class="legend">
    <span class="st-implemented">implemented</span>
    <span class="st-specced">specced</span>
    <span class="st-planned">planned</span>
    <span class="st-proposed">proposed</span>
    <span class="hint">Hover một module: vàng = nó depend vào, xanh lá = depend vào nó</span>
  </div>
</header>
<main id="matrix"></main>

<!-- /ndv-module-matrix regenerates this block from <matrixRoot>/modules.json — do not hand-edit.
     Sample data below is a placeholder shape, not a real project. -->
<script id="module-data" type="application/json">
{
  "project": "Sample Project",
  "generated": "1970-01-01",
  "modules": [
    { "id": "CORE-EventBus",   "name": "EventBus",   "layer": 0, "path": "src/Core/EventBus",     "namespace": "Core.EventBus",   "deps": [],                                 "tdd": "", "spec": "Specs/CORE-EventBus",   "status": "implemented" },
    { "id": "CORE-Modules",    "name": "Modules",    "layer": 1, "path": "src/Core/Modules",      "namespace": "Core.Modules",    "deps": ["CORE-EventBus"],                  "tdd": "", "spec": "Specs/CORE-Modules",    "status": "implemented" },
    { "id": "GAME-Config",     "name": "Config",     "layer": 2, "path": "src/Game/Config",       "namespace": "Game.Config",     "deps": ["CORE-Modules"],                   "tdd": "", "spec": "Specs/GAME-Config",     "status": "specced" },
    { "id": "GAME-Progression","name": "Progression","layer": 3, "path": "src/Game/Progression",  "namespace": "Game.Progression","deps": ["GAME-Config", "CORE-EventBus"],   "tdd": "", "spec": "Specs/GAME-Progression","status": "proposed" }
  ]
}
</script>

<script>
(function () {
  const matrixEl = document.getElementById("matrix");
  let data;
  try {
    data = JSON.parse(document.getElementById("module-data").textContent);
  } catch (e) {
    matrixEl.innerHTML = '<div class="error">modules.json nhúng không parse được: ' + e.message + '</div>';
    return;
  }
  const mods = data.modules || [];
  const hasPlanned = mods.some(m => (m.plannedDeps || []).length);
  document.getElementById("title").textContent = (data.project ? data.project + " — " : "") + "Module Matrix";
  document.title = (data.project ? data.project + " — " : "") + "Module Matrix";
  document.getElementById("meta").textContent =
    "Generated " + (data.generated || "?") + " · " + mods.length + " modules · waterfall layers (L0 = Foundation)" +
    (hasPlanned ? " · deps = có trong code, planned = đã khai trong spec/TDD chưa build" : "");

  const byId = Object.fromEntries(mods.map(m => [m.id, m]));
  const dependents = {};
  mods.forEach(m => (m.deps || []).forEach(d => (dependents[d] = dependents[d] || []).push(m.id)));
  const plannedDependents = {};
  mods.forEach(m => (m.plannedDeps || []).forEach(d => (plannedDependents[d] = plannedDependents[d] || []).push(m.id)));

  const layers = [...new Set(mods.map(m => m.layer))].sort((a, b) => a - b);
  layers.forEach(layer => {
    const row = document.createElement("div");
    row.className = "layer";
    const inLayer = mods.filter(m => m.layer === layer).sort((a, b) => a.id.localeCompare(b.id));
    row.innerHTML =
      '<div class="layer-label"><div class="n">Layer ' + layer + '</div>' +
      '<div class="d">' + (layer === 0 ? "Foundation — không depend module nào" : "depends chỉ vào Layer &lt; " + layer) + '</div>' +
      '<div class="d">' + inLayer.length + ' module</div></div>';
    const wrap = document.createElement("div");
    wrap.className = "layer-modules";
    inLayer.forEach(m => {
      const card = document.createElement("div");
      card.className = "module";
      card.dataset.id = m.id;
      const deps = (m.deps || []).length ? (m.deps || []).map(d => byId[d] ? d : d + " ⚠").join(", ") : "—";
      const planned = (m.plannedDeps || []).map(d => byId[d] ? d : d + " ⚠").join(", ");
      card.innerHTML =
        '<span class="badge ' + (m.status || "proposed") + '">' + (m.status || "proposed") + '</span>' +
        '<div class="id">' + m.id + '</div>' +
        '<div class="ns">' + (m.namespace || "") + '</div>' +
        '<div class="deps"><b>deps:</b> ' + deps + '</div>' +
        (planned ? '<div class="deps planned-deps"><b>planned:</b> ' + planned + '</div>' : "") +
        '<div class="links">' +
          (m.spec ? '<a href="../' + m.spec + '">spec</a>' : "") +
          (m.tdd ? '<a href="../' + m.tdd + '">tdd</a>' : "") +
          (m.path ? '<a href="../' + m.path + '">code</a>' : "") +
        '</div>';
      wrap.appendChild(card);
    });
    row.appendChild(wrap);
    matrixEl.appendChild(row);
  });

  const cards = [...document.querySelectorAll(".module")];
  cards.forEach(card => {
    card.addEventListener("mouseenter", () => {
      const m = byId[card.dataset.id];
      const depSet = new Set(m.deps || []);
      const depdSet = new Set(dependents[m.id] || []);
      const planSet = new Set([...(m.plannedDeps || []), ...(plannedDependents[m.id] || [])]);
      cards.forEach(c => {
        c.classList.remove("hl-self", "hl-dep", "hl-dependent", "hl-planned", "dim");
        if (c === card) c.classList.add("hl-self");
        else if (depSet.has(c.dataset.id)) c.classList.add("hl-dep");
        else if (depdSet.has(c.dataset.id)) c.classList.add("hl-dependent");
        else if (planSet.has(c.dataset.id)) c.classList.add("hl-planned");
        else c.classList.add("dim");
      });
    });
    card.addEventListener("mouseleave", () =>
      cards.forEach(c => c.classList.remove("hl-self", "hl-dep", "hl-dependent", "hl-planned", "dim")));
  });
})();
</script>
</body>
</html>
